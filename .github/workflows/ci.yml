name: Continum CI

on:
  push:
    branches: [main, develop, akshit-dev, feat/gemini-migration, chore/lint-normalization, chore/repo-governance]
  pull_request:
    branches: [main, develop, akshit-dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Unit + calibration tests ──────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run fast tests
        run: |
          python -m pytest continum/tests \
            -v --tb=short -m "not slow" \
            --cov=continum/ExpSuite/stats_inference \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Run calibration tests
        run: |
          python -m pytest continum/tests \
            -v --tb=short -m "slow"

      - name: Syntax check all modules
        run: |
          python -c "
          import py_compile, glob, sys
          files = glob.glob('continum/**/*.py', recursive=True)
          errors = []
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(str(e))
          if errors:
              print('Syntax errors:')
              for e in errors:
                  print(' ', e)
              sys.exit(1)
          print(f'All {len(files)} files pass syntax check')
          "

  # ── Import smoke test ─────────────────────────────────────────────────────
  imports:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test all public imports
        run: |
          python -c "
          from continum.config import settings
          from continum.state import AgentState, AnalysisState, PlanningState, MonitoringState, IngestionState, AskDataState
          from continum.ExpSuite.stats_inference import (
              calculate_hypothesis_test, detect_srm, apply_cuped,
              run_sprt, run_bayesian_ab_test, check_guardrail_metric,
          )
          from continum.ExpSuite.causal import calculate_diff_in_diff, run_monte_carlo_forecast, run_causal_engine
          from continum.ExpSuite.planning import (
              calculate_power, calculate_opportunity_size,
              plan_experiment_metrics, calculate_traffic_balance,
          )
          from continum.AskData import generate_visualization, execute_sql_query, simulate_and_visualize_growth
          from continum.mapMeta import scan_database_schema, catalog_experiments, fetch_statsig_experiment_health
          from continum.orchestration.tools.registry import all_experimentation_tools
          from continum.orchestration.supervisor import app_graph
          from continum.registry import list_modules

          mods = list_modules()
          assert len(mods) >= 18, f'Expected >= 18 modules, got {len(mods)}'
          assert len(all_experimentation_tools) >= 15, f'Expected >= 15 tools, got {len(all_experimentation_tools)}'
          print(f'All imports OK — {len(mods)} modules, {len(all_experimentation_tools)} tools registered')
          "

  # ── Pipeline integration test ─────────────────────────────────────────────
  integration:
    name: Pipeline integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: End-to-end pipeline test
        run: |
          python -m pytest continum/tests/test_pipeline_integration.py -v --tb=short
